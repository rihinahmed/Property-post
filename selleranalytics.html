<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Analytics - PropertyPost</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="./stylings/selleranalytics.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-home"></i> PropertyPost
            </div>
            <nav>
                <a href="./sellerdashboard.html"> <i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a href="./sellerproperties.html"><i class="fas fa-building"></i> Properties</a>
                <a href="./sellermessage.html"><i class="fas fa-envelope"></i> Messages</a>
                <a href="./selleranalytics.html" class="active"><i class="fas fa-chart-line"></i> Analytics</a>
                <a href="./sellersettings.html"><i class="fas fa-cog"></i> Settings</a>
                <a href="#logout" class="logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <section class="analytics-section">
                <h1>Dashboard Analytics</h1>

                <div class="stats-cards">
                    <div class="card">
                        <h3>Total Properties</h3>
                        <p class="count" data-target="0">0</p>
                    </div>
                    <div class="card">
                        <h3>Active Listings</h3>
                        <p class="count" data-target="0">0</p>
                    </div>
                    <div class="card">
                        <h3>Monthly Views</h3>
                        <p class="count" data-target="0">0</p>
                    </div>
                    <div class="card">
                        <h3>New Messages</h3>
                        <p class="count" data-target="0">0</p>
                    </div>
                </div>
                <div id="loading-indicator" style="text-align: center; padding: 20px; font-style: italic; color: #888;">Loading analytics data...</div>

                <div class="charts">
                    <div class="chart-card">
                        <h3>Property Views (Last 6 months)</h3>
                        <canvas id="viewsChart"></canvas>
                    </div>
                    <div class="chart-card">
                        <h3>New Listings (Last 6 months)</h3>
                        <canvas id="listingsChart"></canvas>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script>
        // Placeholder for the seller's ID. This should be obtained from a user session.
        const sellerId = 1;

        // Function to animate the counters
        function animateCounters() {
            const counters = document.querySelectorAll('.count');
            counters.forEach(counter => {
                const updateCount = () => {
                    const target = +counter.getAttribute('data-target');
                    const count = +counter.innerText;
                    const increment = target / 200;

                    if (count < target) {
                        counter.innerText = Math.ceil(count + increment);
                        setTimeout(updateCount, 15);
                    } else {
                        counter.innerText = target.toLocaleString();
                    }
                };
                updateCount();
            });
        }

        // Function to render the charts
        let viewsChart, listingsChart;
        function renderCharts(viewsData, listingsData) {
            const viewsCtx = document.getElementById('viewsChart').getContext('2d');
            const listingsCtx = document.getElementById('listingsChart').getContext('2d');
            
            // Destroy existing charts if they exist to prevent duplicates
            if (viewsChart) viewsChart.destroy();
            if (listingsChart) listingsChart.destroy();

            viewsChart = new Chart(viewsCtx, {
                type: 'line',
                data: {
                    labels: viewsData.labels,
                    datasets: [{
                        label: 'Views',
                        data: viewsData.data,
                        borderColor: '#4fc3f7',
                        backgroundColor: 'rgba(79,195,247,0.3)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 5,
                        pointHoverRadius: 7,
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: '#fff' }}},
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#ddd' },
                            grid: { color: 'rgba(255,255,255,0.1)' }
                        },
                        x: {
                            ticks: { color: '#ddd' },
                            grid: { color: 'rgba(255,255,255,0.1)' }
                        }
                    }
                }
            });

            listingsChart = new Chart(listingsCtx, {
                type: 'bar',
                data: {
                    labels: listingsData.labels,
                    datasets: [{
                        label: 'New Listings',
                        data: listingsData.data,
                        backgroundColor: '#4fc3f7',
                        borderRadius: 6,
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false }},
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#ddd' },
                            grid: { color: 'rgba(255,255,255,0.1)' }
                        },
                        x: {
                            ticks: { color: '#ddd' },
                            grid: { color: 'rgba(255,255,255,0.1)' }
                        }
                    }
                }
            });
        }

        // Main function to fetch all data and update the page
        async function fetchAnalyticsData() {
            const loadingIndicator = document.getElementById('loading-indicator');
            loadingIndicator.style.display = 'block';

            try {
                const response = await fetch(`http://localhost:5000/api/analytics/${sellerId}`);
                const result = await response.json();
                
                loadingIndicator.style.display = 'none';

                if (result.success) {
                    const data = result.data;
                    
                    // Update the stats cards
                    document.querySelector('.stats-cards .card:nth-child(1) .count').setAttribute('data-target', data.totalProperties);
                    document.querySelector('.stats-cards .card:nth-child(2) .count').setAttribute('data-target', data.activeListings);
                    document.querySelector('.stats-cards .card:nth-child(3) .count').setAttribute('data-target', data.totalMonthlyViews);
                    document.querySelector('.stats-cards .card:nth-child(4) .count').setAttribute('data-target', data.newMessages);
                    
                    // Animate the counters with the new values
                    animateCounters();

                    // Render the charts with the fetched data
                    renderCharts(data.viewsChart, data.listingsChart);

                } else {
                    console.error("Failed to fetch analytics data:", result.message);
                    loadingIndicator.innerText = 'Failed to load analytics data.';
                }
            } catch (error) {
                console.error("Network error fetching analytics data:", error);
                loadingIndicator.innerText = 'Network error. Please check your server.';
            }
        }

        // Initialize the page by fetching the data
        document.addEventListener('DOMContentLoaded', () => {
            fetchAnalyticsData();
        });
    </script>
</body>
</html>
