<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RoomFinder Dashboard</title>
  <link rel="stylesheet" href="/stylings/style.css" />
  <link rel="stylesheet" href="/stylings/dashboard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="dashboard">
    <aside class="sidebar">
      <div class="logo">RoomFinder</div>
      <nav>
        <a href="index.html"><i class="fas fa-door-open"></i> Home</a>
        <a href="/dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="/rooms"><i class="fas fa-door-open"></i> Rooms</a>
        <a href="/blog"><i class="fas fa-blog"></i> Blog</a>
        <a href="/contact"><i class="fas fa-envelope"></i> Contact</a>
      </nav>
    </aside>

    <main class="main">
      <header class="main-header">
        <div class="search-box">
          <input type="search" placeholder="Search..." />
          <i class="fas fa-search"></i>
        </div>
        <div class="user-info">
          <div class="dashboard-info">
            <h3 id="welcomeMsg">Welcome, Guest!</h3>
            <p id="userRole">You are not logged in.</p>
          </div>
          <img id="userAvatar" src="images/rihin.jpg" alt="User Avatar" />
        </div>
      </header>

      <section class="content">
        <div class="summary-cards">
          <div class="card"><h3>Total Rooms</h3><p>0</p></div>
          <div class="card"><h3>New Listings</h3><p>0</p></div>
          <div class="card"><h3>Blog Posts</h3><p>0</p></div>
          <div class="card"><h3>Messages</h3><p>0</p></div>
        </div>

        <section class="recent-section">
          <h2>Recent Activity</h2>
          <table>
            <thead>
              <tr><th>Date</th><th>Activity</th><th>Status</th><th>Details</th></tr>
            </thead>
            <tbody></tbody> <!-- Dynamic -->
          </table>
        </section>
      </section>
    </main>
  </div>

  <!-- ✅ Profile Upload Modal -->
  <div class="user-modal" id="userModal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal()">&times;</span>
      <h2>Upload Your Details</h2>
      <form id="userDetailsForm" enctype="multipart/form-data" method="POST">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" required />

        <label for="phoneNumber">Phone Number</label>
        <input type="tel" id="phoneNumber" name="phoneNumber" required />

        <label for="address">Address</label>
        <textarea id="address" name="address" rows="3" required></textarea>

        <label for="occupation">Occupation</label>
        <input type="text" id="occupation" name="occupation" required />

        <label for="profileImg">Profile Image</label>
        <input type="file" id="profileImg" name="profile_image" accept="image/*" />
        <img id="profilePreview" class="preview-img" style="display: none;" />

        <label for="nidPhoto">NID Card Photo</label>
        <input type="file" id="nidPhoto" name="nid_photo" accept="image/*" />
        <img id="nidPreview" class="preview-img" style="display: none;" />

        <div class="popup-buttons">
          <button type="submit">Submit</button>
          <button type="button" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ✅ Session Check & Avatar Setup -->
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch("http://localhost:5000/api/user/session", {
          credentials: "include"
        });
        const data = await res.json();

        if (data.loggedIn && data.user) {
          document.getElementById("welcomeMsg").textContent = `Welcome, ${data.user.name}!`;
          document.getElementById("userRole").textContent = `Role: ${data.user.role}`;
          if (data.user.profile_img) {
            document.getElementById("userAvatar").src = `http://localhost:5000/uploads/${data.user.profile_img}?t=${Date.now()}`;
          }
        } else {
          window.location.href = "login.html";
        }
      } catch (err) {
        console.error("❌ Session check error:", err);
        window.location.href = "login.html";
      }
    });
  </script>

  <!-- ✅ Avatar Click - Show Modal or Alert -->
  <script>
    document.getElementById("userAvatar").addEventListener("click", async () => {
      try {
        const res = await fetch("http://localhost:5000/api/user/profile", {
          credentials: "include"
        });
        const result = await res.json();

        if (result.success && result.data) {
          const d = result.data;
          document.getElementById("fullName").value = d.fullName || "";
          document.getElementById("phoneNumber").value = d.phone || "";
          document.getElementById("address").value = d.address || "";
          document.getElementById("occupation").value = d.occupation || "";

          if (d.profile_img) {
            document.getElementById("profilePreview").src = `http://localhost:5000/uploads/${d.profile_img}?t=${Date.now()}`;
            document.getElementById("profilePreview").style.display = "block";
          }

          if (d.nid_photo) {
            document.getElementById("nidPreview").src = `http://localhost:5000/uploads/${d.nid_photo}?t=${Date.now()}`;
            document.getElementById("nidPreview").style.display = "block";
          }

          document.getElementById("userModal").style.display = "flex";
        } else {
          alert("No user data found. Please submit your details.");
          document.getElementById("userModal").style.display = "flex";
        }
      } catch (err) {
        console.error("❌ Fetch profile error:", err);
        alert("Error fetching profile data");
      }
    });

    function closeModal() {
      document.getElementById("userModal").style.display = "none";
    }

    window.addEventListener("click", (e) => {
      if (e.target === document.getElementById("userModal")) {
        closeModal();
      }
    });

    function showPreview(inputId, imgId) {
      const input = document.getElementById(inputId);
      const img = document.getElementById(imgId);
      input.addEventListener("change", () => {
        const file = input.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            img.src = e.target.result;
            img.style.display = "block";
          };
          reader.readAsDataURL(file);
        } else {
          img.style.display = "none";
        }
      });
    }

    showPreview("nidPhoto", "nidPreview");
    showPreview("profileImg", "profilePreview");
  </script>

  <!-- ✅ Form Submit -->
  <script>
    document.getElementById("userDetailsForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const formData = new FormData(this);

      try {
        const res = await fetch("http://localhost:5000/api/user/profile", {
          method: "POST",
          body: formData,
          credentials: "include"
        });

        const data = await res.json();

        if (data.success) {
          alert("✅ Info submitted successfully!");
          if (data.profile_img) {
            document.getElementById("userAvatar").src = `http://localhost:5000/uploads/${data.profile_img}?t=${Date.now()}`;
          }
          closeModal();
        } else {
          alert("❌ Submission failed: " + data.message);
        }
      } catch (err) {
        console.error("❌ Upload error:", err);
        alert("❌ An error occurred while uploading.");
      }
    });
  </script>

  <!-- ✅ Dashboard Summary -->
  <script>
    async function loadDashboardStats() {
      try {
        const res = await fetch("http://localhost:5000/api/dashboard/summary", {
          credentials: "include"
        });
        const result = await res.json();
  
        if (result.success && result.data) {
          document.querySelector(".card:nth-child(1) p").textContent = result.data.totalRooms;
          document.querySelector(".card:nth-child(2) p").textContent = result.data.newListings;
          document.querySelector(".card:nth-child(3) p").textContent = result.data.blogPosts;
  
          // Use announcement count for Messages card
          document.querySelector(".card:nth-child(4) p").textContent = result.data.announcementCount || 0;
        }
      } catch (err) {
        console.error("❌ Error loading dashboard stats:", err);
      }
    }
  
    loadDashboardStats();
  </script>
  

  <!-- ✅ Recent Activity (Dynamic with colored status) -->
  <script>
    async function loadRecentActivity() {
      try {
        const res = await fetch("http://localhost:5000/api/dashboard/activity", {
          credentials: "include"
        });
        const result = await res.json();

        if (result.success && result.data) {
          const tbody = document.querySelector(".recent-section tbody");
          tbody.innerHTML = "";

          result.data.forEach((activity) => {
            const status = activity.STATUS.toLowerCase();
            const statusClass =
              status === "approved" || status === "live"
                ? "success"
                : status === "pending"
                ? "warning"
                : "error";

            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${new Date(activity.ACTIVITY_DATE).toISOString().split("T")[0]}</td>
              <td>${activity.ACTIVITY_TYPE}</td>
              <td><span class="status ${statusClass}">${activity.STATUS}</span></td>
              <td>${activity.DETAILS}</td>
            `;
            tbody.appendChild(tr);
          });
        }
      } catch (err) {
        console.error("❌ Error loading recent activity:", err);
      }
    }

    loadRecentActivity();
    setInterval(loadRecentActivity, 10000);
  </script>

</body>
</html>
