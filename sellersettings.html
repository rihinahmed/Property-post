<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - PropertyPost</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="./stylings/sellersettings.css">
<style>
    /* Optional quick inline style for profile preview */
    #profile-picture {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background-color: #ddd;
        background-size: cover;
        background-position: center;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: #555;
    }
</style>
</head>
<body>
<button class="menu-toggle" onclick="toggleSidebar()">
    <i class="fas fa-bars"></i>
</button>

<div class="dashboard">
    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <i class="fas fa-home"></i> PropertyPost
        </div>
        <nav>
            <a href="./sellerdashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="./sellerproperties.html"><i class="fas fa-building"></i> Properties</a>
            <a href="./sellermessage.html"><i class="fas fa-envelope"></i> Messages</a>
            <a href="./selleranalytics.html"><i class="fas fa-chart-line"></i> Analytics</a>
            <a href="./sellersettings.html" class="active"><i class="fas fa-cog"></i> Settings</a>
            <a href="#" class="logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </aside>

    <main class="main-content">
        <section class="settings-section">
            <h1>Settings</h1>
            <div id="loading-indicator" style="text-align: center; padding: 20px; display: none;">Loading settings...</div>
            <div id="error-message" style="text-align: center; padding: 20px; color: red; display: none;"></div>
            
            <form class="settings-form" id="settings-form" style="display: none;">
                <input type="hidden" id="user-id" name="userId">
                <input type="hidden" id="hidden-email" name="email">

                <div class="profile-section">
                    <div class="profile-picture-container">
                        <div class="profile-picture" id="profile-picture">
                            <i class="fas fa-camera"></i>
                        </div>
                        <input type="file" id="profile-upload" name="profile_img" accept="image/*" style="display:none;">
                    </div>
                    <p class="upload-text">Click the camera icon to upload profile picture</p>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="full-name">Full Name</label>
                        <input type="text" id="full-name" name="full_name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="john@example.com" required readonly>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="+1 234 567 8901">
                    </div>
                    <div class="form-group">
                        <label for="nid_photo">NID Number</label>
                        <input type="text" id="nid_photo" name="nid_photo" placeholder="5572........">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group form-group-full">
                        <label for="address">Business Address</label>
                        <input type="text" id="address" name="address" placeholder="123 Main St, City, State 12345">
                    </div>
                </div>

                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" name="bio" placeholder="Tell us about yourself..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn save-btn" id="save-btn">
                        <i class="fas fa-save"></i>
                        <span class="btn-text">Save Changes</span>
                    </button>
                    <button type="reset" class="btn reset-btn">
                        <i class="fas fa-undo"></i>
                        Reset
                    </button>
                </div>
            </form>
        </section>
    </main>
</div>

<div class="success-message" id="success-message">
    <i class="fas fa-check-circle"></i>
    <span>Settings saved successfully!</span>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
    console.log("Page loaded - starting settings initialization");
    
    const loadingEl = document.getElementById("loading-indicator");
    const errorEl = document.getElementById("error-message");
    const formEl = document.getElementById("settings-form");
    const profilePic = document.getElementById("profile-picture");
    const profileUpload = document.getElementById("profile-upload");

    try {
        // Check session
        console.log("Checking session...");
        const sessionRes = await fetch("http://localhost:5000/api/user/session", { 
            credentials: "include" 
        });
        const sessionData = await sessionRes.json();
        console.log("Session data:", sessionData);

        if (!sessionData.loggedIn || sessionData.user.role.toLowerCase() !== "seller") {
            console.log("Session invalid, redirecting to login");
            window.location.replace("login.html");
            return;
        }

        // Set hidden fields
        document.getElementById("user-id").value = sessionData.user.id;
        document.getElementById("hidden-email").value = sessionData.user.email;

        // Show loading
        loadingEl.style.display = "block";
        formEl.style.display = "none";
        errorEl.style.display = "none";

        // Fetch settings
        console.log("Fetching settings...");
        const settingsRes = await fetch("http://localhost:5000/api/settings", { 
            credentials: "include" 
        });
        const settingsData = await settingsRes.json();
        console.log("Settings data received:", settingsData);

        if (!settingsData.success) {
            throw new Error(settingsData.message || "Failed to fetch settings");
        }

        const s = settingsData.settings;
        console.log("Populating form with:", s);

        // Oracle returns uppercase column names, so check both formats
        const fullName = s.full_name || s.FULL_NAME || '';
        const phone = s.phone || s.PHONE || '';
        const nidPhoto = s.nid_photo || s.NID_PHOTO || '';
        const address = s.address || s.ADDRESS || '';
        const bio = s.bio || s.BIO || '';
        const profileImg = s.profile_img || s.PROFILE_IMG || '';

        // Wait a bit for DOM to be ready
        await new Promise(resolve => setTimeout(resolve, 100));

        // Populate form fields
        const fullNameField = document.getElementById("full-name");
        const emailField = document.getElementById("email");
        const phoneField = document.getElementById("phone");
        const nidField = document.getElementById("nid_photo");
        const addressField = document.getElementById("address");
        const bioField = document.getElementById("bio");

        // Set values and remove placeholder
        if (fullName) {
            fullNameField.value = fullName;
            fullNameField.removeAttribute("placeholder");
        }
        
        emailField.value = sessionData.user.email;
        emailField.removeAttribute("placeholder");
        
        if (phone) {
            phoneField.value = phone;
            phoneField.removeAttribute("placeholder");
        }
        
        if (nidPhoto) {
            nidField.value = nidPhoto;
            nidField.removeAttribute("placeholder");
        }
        
        if (address) {
            addressField.value = address;
            addressField.removeAttribute("placeholder");
        }
        
        if (bio) {
            bioField.value = bio;
            bioField.removeAttribute("placeholder");
        }

        // Handle profile image
        if (profileImg) {
            profilePic.style.backgroundImage = `url(http://localhost:5500/backend/selleruploads/${profileImg})`;
            profilePic.innerHTML = '';
        }

        // Hide loading and show form
        loadingEl.style.display = "none";
        formEl.style.display = "block";

        console.log("Form populated successfully");

        // Verify values were set
        setTimeout(() => {
            console.log("Verification - Form field values:");
            console.log("Full Name:", fullNameField.value);
            console.log("Phone:", phoneField.value);
            console.log("NID:", nidField.value);
            console.log("Address:", addressField.value);
            console.log("Bio:", bioField.value);
        }, 200);

    } catch (err) {
        console.error("Error:", err);
        loadingEl.style.display = "none";
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
    }

    // Profile picture click handler
    profilePic.addEventListener("click", () => profileUpload.click());

    // Profile upload preview
    profileUpload.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
            alert('Please select a valid image file');
            return;
        }

        const reader = new FileReader();
        reader.onload = () => {
            profilePic.style.backgroundImage = `url(${reader.result})`;
            profilePic.innerHTML = '';
        };
        reader.readAsDataURL(file);
    });

    // Form submission
    formEl.addEventListener("submit", async (e) => {
        e.preventDefault();
        console.log("Saving settings...");

        const btn = document.getElementById("save-btn");
        const btnText = btn.querySelector(".btn-text");
        btn.disabled = true;
        btnText.textContent = "Saving...";

        try {
            const formData = new FormData(formEl);
            const res = await fetch("http://localhost:5000/api/settings/update", {
                method: "POST",
                credentials: "include",
                body: formData
            });

            const data = await res.json();
            console.log("Save response:", data);

            if (data.success) {
                showSuccess("Settings updated successfully!");
                profileUpload.value = "";
            } else {
                alert(data.message || "Failed to save settings.");
            }
        } catch (err) {
            console.error("Save error:", err);
            alert("Error saving settings: " + err.message);
        } finally {
            btn.disabled = false;
            btnText.textContent = "Save Changes";
        }
    });

    // Success message function
    function showSuccess(msg) {
        const successEl = document.getElementById("success-message");
        successEl.querySelector("span").textContent = msg;
        successEl.style.display = "flex";
        setTimeout(() => successEl.style.display = "none", 3000);
    }

    // Logout handler
    document.querySelector(".logout").addEventListener("click", async (e) => {
        e.preventDefault();
        try {
            await fetch("http://localhost:5000/api/user/logout", { 
                method: "POST", 
                credentials: "include" 
            });
        } catch (err) {
            console.error("Logout failed:", err);
        }
        window.location.replace("login.html");
    });
});

// Sidebar toggle
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
}
    </script>
    
    
    
</body>
</html>
