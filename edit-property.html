<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PropertyPost - Edit Property</title>
    <link rel="stylesheet" href="./stylings/edit-property.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        <!-- Enhanced Animated Particles Background -->
        <div class="particles-container" id="particlesContainer"></div>

        <!-- Floating geometric shapes -->
        <div class="floating-shapes" id="floatingShapes"></div>

        <!-- Enhanced floating orbs with deeper colors -->
        <div class="floating-orb orb-1"></div>
        <div class="floating-orb orb-2"></div>
        <div class="floating-orb orb-3"></div>
        <div class="floating-orb orb-4"></div>

        <!-- Animated aurora effect -->
        <div class="aurora-container">
            <div class="aurora-line aurora-1"></div>
            <div class="aurora-line aurora-2"></div>
        </div>

        <div class="content-wrapper">
            <div class="container">
                <!-- Header with enhanced glow -->
                <div class="header">
                    <div class="brand">
                        <div class="brand-glow"></div>
                        <i class="fas fa-home"></i>
                        <h1>PropertyPost</h1>
                    </div>
                    <h2>Edit Property</h2>
                    <p>Update your property details and showcase its best features</p>
                </div>

                <form class="property-form" id="propertyForm">
                    <div class="form-glow-1"></div>
                    <div class="form-glow-2"></div>
                    <div class="form-content">
                        <!-- Property Title -->
                        <div class="form-group">
                            <label for="title" class="form-label">Property Title</label>
                            <input
                                type="text"
                                id="title"
                                name="title"
                                placeholder="Enter property title..."
                                class="form-input"
                                value="Luxury Downtown Apartment"
                            />
                        </div>

                        <!-- Rent and Location -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="rent" class="form-label">
                                    <i class="fas fa-dollar-sign"></i>
                                    Monthly Rent
                                </label>
                                <input
                                    type="number"
                                    id="rent"
                                    name="rent"
                                    placeholder="2500"
                                    class="form-input"
                                    value="2500"
                                />
                            </div>
                            <div class="form-group">
                                <label for="locationAddress" class="form-label">
                                    <i class="fas fa-map-marker-alt"></i>
                                    Location Address
                                </label>
                                <input
                                    type="text"
                                    id="locationAddress"
                                    name="locationAddress"
                                    placeholder="Full address..."
                                    class="form-input"
                                    value="123 Downtown Ave, City Center, State 12345"
                                />
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="form-group">
                            <label for="description" class="form-label">Property Description</label>
                            <textarea
                                id="description"
                                name="description"
                                rows="5"
                                placeholder="Describe your property in detail..."
                                class="form-textarea"
                            >Beautiful downtown apartment with modern amenities and stunning city views. Perfect for professionals or couples looking for a premium living experience.</textarea>
                        </div>

                        <!-- Property Images -->
                        <div class="form-group">
                            <label class="form-label">Property Images</label>
                            <div class="images-grid" id="imagesGrid">
                                <!-- Initial images will be added by JavaScript -->
                            </div>
                            <div class="upload-area" onclick="document.getElementById('images').click()">
                                <i class="fas fa-upload"></i>
                                <p>Click to upload images</p>
                            </div>
                            <input
                                type="file"
                                id="images"
                                accept="image/*"
                                multiple
                                style="display: none;"
                            />
                        </div>

                        <!-- Amenities -->
                        <div class="form-group">
                            <label class="form-label">Amenities</label>
                            <div class="tags-container" id="amenitiesContainer">
                                <!-- Amenities will be added by JavaScript -->
                            </div>
                            <div class="add-item-container">
                                <input
                                    type="text"
                                    id="newAmenity"
                                    placeholder="Add amenity..."
                                    class="form-input"
                                />
                                <button type="button" class="add-btn" onclick="addAmenity()">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Pros and Cons -->
                        <div class="pros-cons-row">
                            <!-- Pros -->
                            <div class="form-group">
                                <label class="form-label pros-label">Pros</label>
                                <div class="pros-container" id="prosContainer">
                                    <!-- Pros will be added by JavaScript -->
                                </div>
                                <div class="add-item-container">
                                    <input
                                        type="text"
                                        id="newPro"
                                        placeholder="Add a positive point..."
                                        class="form-input"
                                    />
                                    <button type="button" class="add-btn pros-btn" onclick="addPro()">
                                        <i class="fas fa-plus"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Cons -->
                            <div class="form-group">
                                <label class="form-label cons-label">Cons</label>
                                <div class="cons-container" id="consContainer">
                                    <!-- Cons will be added by JavaScript -->
                                </div>
                                <div class="add-item-container">
                                    <input
                                        type="text"
                                        id="newCon"
                                        placeholder="Add a concern..."
                                        class="form-input"
                                    />
                                    <button type="button" class="add-btn cons-btn" onclick="addCon()">
                                        <i class="fas fa-plus"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Form Actions -->
                        <div class="form-actions">
                            <button type="submit" class="btn-primary">
                                <i class="fas fa-save"></i>
                                Save Property
                            </button>
                            <button type="button" class="btn-secondary" onclick="resetForm()">
                                <i class="fas fa-undo"></i>
                                Reset Changes
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="./js/edit-property.js"></script>
</body>
</html>
