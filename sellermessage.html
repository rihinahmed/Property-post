<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Messages - PropertyPost</title>
  <link rel="stylesheet" href="./stylings/sellermessage.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="message-container">
    <div class="message-list">
      <h2>Inbox</h2>
      <div class="search-bar">
        <input type="text" placeholder="Search messages..." />
      </div>
      <div class="message">
        <img src="https://i.pravatar.cc/40?img=1" alt="User avatar" />
        <div class="message-info">
          <h4>Rahim Khan</h4>
          <p>Hi, is this room still available?</p>
        </div>
      </div>
      <div class="message">
        <img src="https://i.pravatar.cc/40?img=2" alt="User avatar" />
        <div class="message-info">
          <h4>Sumaiya Akter</h4>
          <p>Thanks for confirming!</p>
        </div>
      </div>
      <!-- Add more messages as needed -->
    </div>

    <div class="chat-box">
      <div class="chat-header">Rahim Khan</div>
      <div class="chat-messages">
        <div class="chat-message received">Hi, is this room still available?</div>
        <div class="chat-message sent">Yes, it's available. Do you want to schedule a visit?</div>
        <div class="chat-message received">Yes, tomorrow 3 PM works?</div>
        <div class="chat-message sent">Perfect! See you then.</div>
      </div>
      <div class="chat-input">
        <input type="text" placeholder="Type a message..." />
        <button>Send</button>
      </div>
    </div>
  </div>
</body>
</html>
