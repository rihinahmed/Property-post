<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password - RoomFinder</title>
  <link rel="stylesheet" href="/stylings/login_style.css"/>
  <link rel="stylesheet" href="/stylings/chat_btn_style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <style>
    .forgot-password-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      padding: 40px 20px;
    }

    .forgot-password-box {
      background: #ffffff;
      border-radius: 10px;
      padding: 40px 30px;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.1),
                  0 10px 10px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .forgot-password-box h2 {
      margin-bottom: 20px;
      color: var(--primary-color);
    }

    .forgot-password-box p {
      font-size: 14px;
      color: #666;
      margin-bottom: 30px;
    }

    .forgot-password-box input {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 20px;
      border-radius: 5px;
      border: 1px solid #ddd;
      outline: none;
      background: #f2f2f2;
    }

    .forgot-password-box button {
      width: 100%;
      padding: 12px;
      background-color: #ff4b2b;
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .forgot-password-box button:hover {
      background-color: #ff2a00;
    }

    .back-link {
      margin-top: 20px;
      display: block;
      font-size: 14px;
      color: var(--primary-color);
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">RoomFinder</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="browse.html">Browse</a>
      <a href="post-room.html">Post Room</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <!-- Forgot Password Section -->
  <section class="forgot-password-section">
    <div class="forgot-password-box">
      <h2>Forgot Password 🔐</h2>
      <p>Enter your email and we’ll send you a link to reset your password.</p>
      <form action="#">
        <input type="email" name="email" placeholder="Enter your email" required />
        <button type="submit">Send Reset Link</button>
      </form>
      <a href="login.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 RoomFinder. All rights reserved.</p>
  </footer>

  <!-- Live Chat Button -->
    <div id="chat-button" class="chat-button">
        <i class="fas fa-comment-alt"></i>
    </div>

    <!-- Live Chat Window -->
    <div id="chat-window" class="chat-window">
        <div class="chat-header">
            <h3>Chat with us</h3>
            <button id="close-chat" class="close-chat">&times;</button>
        </div>
        <div class="chat-body">
            <div class="message-container" id="message-container"></div>
            <input type="text" id="chat-input" placeholder="Type your message..." />
            <button id="send-message" class="send-button">Send</button>
        </div>
    </div>

    <script src="/js/chatbtn.js"></script>

    <!--spark animation-->
  <script>
    document.addEventListener('click', function (e) {
      const count = 10;
      const sparkColor = '#6366f2'; // Matches your theme
      const size = 6;
      const radius = 40;
      const duration = 600;
  
      for (let i = 0; i < count; i++) {
        const spark = document.createElement('div');
        spark.style.position = 'absolute';
        spark.style.width = 4 + 'px';
        spark.style.height = 4 + 'px';
        spark.style.borderRadius = '50%';
        spark.style.backgroundColor = sparkColor;
        spark.style.pointerEvents = 'none';
        spark.style.zIndex = '9999';
  
        // Correct position on the full page
        const pageX = e.pageX;
        const pageY = e.pageY;
  
        const angle = (2 * Math.PI * i) / count;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
  
        spark.style.left = pageX + 'px';
        spark.style.top = pageY + 'px';
  
        document.body.appendChild(spark);
  
        spark.animate(
          [
            { transform: 'translate(0, 0)', opacity: 1 },
            { transform: `translate(${x}px, ${y}px)`, opacity: 0 }
          ],
          {
            duration: duration,
            easing: 'ease-out'
          }
        );
  
        setTimeout(() => spark.remove(), duration);
      }
    });
  </script>
</body>
</html>
